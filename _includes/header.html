<header class="site-header">
  <div class="site-header__inner">
    <a class="site-name" href="{{ '/' | relative_url }}">Randheer Vennapureddy</a>

    <nav class="site-nav" aria-label="Primary navigation">
      <a
        class="site-nav__link{% if page.nav == 'projects' %} is-active{% endif %}"
        href="{{ '/projects/' | relative_url }}"
        {% if page.nav == 'projects' %}aria-current="page"{% endif %}
      >Projects</a>
      <a
        class="site-nav__link{% if page.nav == 'writing' %} is-active{% endif %}"
        href="{{ '/writing/' | relative_url }}"
        {% if page.nav == 'writing' %}aria-current="page"{% endif %}
      >Writing</a>
      <a
        class="site-nav__link{% if page.nav == 'about' %} is-active{% endif %}"
        href="{{ '/about/' | relative_url }}"
        {% if page.nav == 'about' %}aria-current="page"{% endif %}
      >About</a>
    </nav>
  </div>
</header>
